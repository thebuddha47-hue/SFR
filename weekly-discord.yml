name: Weekly Discord notification
on:
  schedule:
    # UTC windows cover both Hungarian winter and summer time.
    - cron: '0 6 * * 0'
    - cron: '0 7 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Budapest local time
        id: check
        env:
          TZ: Europe/Budapest
        run: |
          if [ "$(date +%u)" = "7" ] && [ "$(date +%H:%M)" = "08:00" ]; then
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: local time is $(date '+%A %H:%M %Z')"
          fi
      - name: Send Discord message
        if: steps.check.outputs.should_send == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 notify.py
